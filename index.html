<style>
:root{--bg1:#f3f0ff;--bg2:#cfc8f3;--ink:#1d1a3d;--sub:#625e96;--panel:rgba(255,255,255,.7);--line:rgba(60,45,150,.16);--accent:#4b3fd1;--pill:rgba(255,255,255,.95);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#25205a;--bg2:#08071a;--ink:#f1efff;--sub:#aaa5e2;--panel:rgba(28,24,72,.7);--line:rgba(190,180,255,.2);--accent:#a79eff;--pill:rgba(22,18,58,.94)}}
:root[data-theme="dark"]{--bg1:#25205a;--bg2:#08071a;--ink:#f1efff;--sub:#aaa5e2;--panel:rgba(28,24,72,.7);--line:rgba(190,180,255,.2);--accent:#a79eff;--pill:rgba(22,18,58,.94)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font-size:10.5px;font-weight:500;background:var(--pill);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap;box-shadow:0 2px 8px rgba(30,20,100,.18);display:none}
.lb.on{background:var(--accent);color:#fff;border-color:transparent;z-index:5}
.lb.pk{display:block;pointer-events:none;font-weight:800}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg1);font-size:12px;padding:3px 10px;border-radius:8px;opacity:0;transition:opacity .15s;z-index:9;white-space:nowrap}
header{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:16px;width:300px;z-index:8}
h1{font-size:32px;font-weight:800;margin:0;line-height:1.15}
header p{margin:4px 0 10px;color:var(--sub);font-size:12.5px}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(30,20,100,.14)}
.in{width:100%;font:inherit;font-size:13px;color:var(--ink);padding:9px 14px;border-radius:14px;outline:none;background:var(--panel)}
.in:focus-visible{border-color:var(--accent)}
#res{margin-top:6px;border-radius:14px;overflow:hidden;display:none}
#res button,#li button{display:block;width:100%;text-align:start;font:inherit;font-size:12.5px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:7px 12px;cursor:pointer}
#res button:hover,#li button:hover{background:var(--line)}
small{color:var(--sub);margin-inline-start:6px;font-size:10.5px}
#lst{position:fixed;inset-inline-start:16px;top:150px;width:300px;max-height:calc(100vh - 440px);min-height:150px;border-radius:16px;display:none;flex-direction:column;z-index:4;overflow:hidden}
#lh{padding:10px 14px 6px;font-size:13px;font-weight:800}
#lh span{display:block;font-weight:300;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.6}
#lst .in{border-radius:0;border:0;border-block:1px solid var(--line);padding:7px 14px;font-size:12px}
#li{overflow:auto;flex:1}
#li h4{margin:0;padding:6px 14px;font-size:11px;font-weight:500;color:var(--accent);background:var(--line);position:sticky;top:0}
aside{position:fixed;inset-inline-end:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;width:176px;max-height:88vh;overflow:auto;scrollbar-width:none}
aside h3{margin:8px 4px 0;font-size:12px;color:var(--sub);font-weight:500}
.chip{display:flex;align-items:center;gap:9px;border-radius:12px;padding:7px 11px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;text-align:start}
.chip i{width:12px;height:12px;border-radius:4px;flex:none}
.chip.on{outline:2px solid var(--accent)}
#info{position:fixed;inset-inline-start:16px;bottom:calc(34px + env(safe-area-inset-bottom,0px));width:300px;border-radius:20px;padding:14px 16px}
#info b{font-size:17px;display:block}
#info span{color:var(--sub);font-size:12px}
#ph{margin-top:10px;height:80px;border-radius:12px;display:grid;place-items:center;font-size:12px;color:var(--sub);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--line) 10px 11px);border:1px dashed var(--line)}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;font:inherit;font-size:11.5px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 4px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent)}
#credit{position:fixed;inset-inline-end:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--sub);pointer-events:none}
@media(max-width:700px){aside{inset-inline-end:8px;left:8px;top:auto;bottom:calc(220px + env(safe-area-inset-bottom,0px));transform:none;width:auto;max-height:26vh;flex-direction:row;flex-wrap:wrap}aside h3{width:100%}#info{width:auto;inset-inline-end:16px}#ph{height:50px}h1{font-size:24px}header{width:auto;inset-inline-end:16px}header p{display:none}#lst{inset-inline-end:16px;width:auto;top:96px;max-height:30vh}#credit{inset-inline-start:16px;inset-inline-end:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
*{-webkit-tap-highlight-color:transparent}#lt{display:none}
#cf{display:flex;gap:5px;padding:6px 12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}#cf button{flex:none;border:0;border-radius:999px;padding:3px 10px;font:inherit;font-size:11px;background:var(--line);color:inherit;cursor:pointer;white-space:nowrap}#cf button.on{background:var(--accent);color:#fff}
.row{flex-wrap:wrap}
#cmp{position:fixed;top:10px;left:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;z-index:3;pointer-events:none;background:var(--pill,rgba(255,255,255,.75));border:1px solid var(--line);font-size:9px;line-height:1.1;text-align:center;color:var(--accent)}.in{user-select:text;-webkit-user-select:text}#li,#res{touch-action:pan-y;overscroll-behavior:contain}
@media(max-width:700px){
header{top:calc(8px + env(safe-area-inset-top,0px));inset-inline-start:10px;inset-inline-end:10px;width:auto}
h1{font-size:20px}header p{display:none}
.in{font-size:16px;padding:8px 12px}
.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--pill)}
#res{max-height:38dvh;overflow:auto}
aside{left:0;right:0;inset-inline-end:0;top:calc(90px + env(safe-area-inset-top,0px));bottom:auto;transform:none;width:auto;max-height:none;flex-direction:row;flex-wrap:nowrap;align-items:center;overflow-x:auto;overflow-y:hidden;padding:2px 10px;gap:6px;touch-action:pan-x;overscroll-behavior:contain}
aside h3{width:auto;flex:none;margin:0 4px;white-space:nowrap}
.chip{flex:none;white-space:nowrap;padding:6px 10px}
#lst{inset-inline-start:10px;inset-inline-end:10px;width:auto;top:calc(136px + env(safe-area-inset-top,0px));min-height:110px;max-height:min(34dvh,calc(100dvh - 430px))}
#lh span{display:none}#lh{padding:8px 12px 4px}
#info{inset-inline-start:10px;inset-inline-end:10px;width:auto;bottom:calc(26px + env(safe-area-inset-bottom,0px));padding:10px 12px;border-radius:16px}
#info b{font-size:15px}#info span{font-size:11px}
#ph{height:44px;margin-top:6px}.row{margin-top:6px;gap:4px}
.btn{font-size:10.5px;white-space:normal;padding:6px 2px}
.lb{font-size:9.5px;padding:1px 5px}
#credit{font-size:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#cmp{top:auto;left:10px;bottom:calc(215px + env(safe-area-inset-bottom,0px))}
#lt{position:fixed;inset-inline-start:10px;top:calc(136px + env(safe-area-inset-top,0px));z-index:5;flex:none;width:auto;padding:7px 14px;border-radius:12px;font-size:12px;color:var(--ink)}
}
</style>
